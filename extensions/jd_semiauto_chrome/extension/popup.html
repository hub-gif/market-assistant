<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>京东半自动采集</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 360px;
        margin: 12px;
        font-size: 13px;
      }
      label {
        display: block;
        margin-top: 8px;
        color: #444;
        font-size: 12px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 6px;
      }
      input[readonly] {
        background: #f3f4f6;
        font-size: 11px;
      }
      .steps {
        font-size: 11px;
        color: #9ca3af;
        margin: 8px 0;
      }
      .step.active {
        color: #1d4ed8;
        font-weight: 600;
      }
      .step.done {
        color: #16a34a;
      }
      .phase {
        color: #1d4ed8;
        font-weight: 500;
        margin: 4px 0;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      button {
        flex: 1;
        min-width: 90px;
        padding: 8px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      button.primary {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 4px;
      }
      button.danger {
        background: #dc2626;
        color: #fff;
        border: none;
        border-radius: 4px;
      }
      #stats {
        margin-top: 8px;
        padding: 8px;
        background: #f5f5f5;
        border-radius: 4px;
        line-height: 1.5;
        font-size: 12px;
        white-space: pre-wrap;
      }
      #msg {
        margin-top: 8px;
        min-height: 1.2em;
        font-size: 12px;
      }
      #msg.ok {
        color: #060;
      }
      #msg.err {
        color: #c00;
      }
      .hint {
        font-size: 11px;
        color: #666;
        margin-top: 8px;
        line-height: 1.4;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h3 style="margin: 0">京东半自动（插件）</h3>

    <section id="panelIdle">
      <label>搜索词</label>
      <input id="keyword" type="text" placeholder="低GI饼干" />
      <label>sidecar</label>
      <input id="sidecarUrl" type="text" value="http://127.0.0.1:8765" />
      <label>
        <input id="createJob" type="checkbox" checked />
        结束后自动解析并入库
      </label>
      <div class="row">
        <button id="btnStart" type="button" class="primary">启动</button>
      </div>
    </section>

    <section id="panelActive" class="hidden">
      <div class="steps" id="steps"></div>
      <p class="phase" id="phaseLabel"></p>
      <label>本任务搜索词</label>
      <input id="sessionKeyword" type="text" readonly />
      <label>run_dir</label>
      <input id="runDir" type="text" readonly />
      <p id="meta" style="font-size: 11px; color: #64748b; margin: 4px 0"></p>
      <div id="stats">—</div>
      <div class="row">
        <button id="btnConfirm" type="button" class="primary hidden">确认登录</button>
        <button id="btnStop" type="button" class="danger hidden">结束任务</button>
        <button id="btnReset" type="button" class="hidden">重新开始</button>
      </div>
    </section>

    <p id="msg"></p>
    <p class="hint">
      状态保存在扩展内，<strong>翻页、关掉本 popup 不会中断监听</strong>。须用本 Chrome 登录
      jd.com 后点「确认登录」，再搜索/翻页/进商详。
    </p>
    <script src="stats_merge.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
